 <!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<style>
		body {
			margin: 0;
			padding: 0;
			background: white;
  			color: black;
			font-family: "Joan", Georgia, 'Palatino Linotype', serif;
		}

		.container {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			text-align: center;
			padding: 1em;
			box-sizing: border-box;
		}

		.quote-box {
			font-size: clamp(1rem, 2.5vw, 3rem);
			line-height: 1.5;
			position: relative;
			margin-bottom: 2em;
			max-width: 90%;
			padding: 2rem;
		}

		.quote-box::before {
			content: "“";
			font-size: clamp(3rem, 13vw, 12rem);
			position: absolute;
			top: 1rem;
			margin-right: 1rem;
			line-height: 0;
			color: gray;
		}

		.quote-box::after {
			content: "”";
			font-size: clamp(3rem, 13vw, 12rem);
			position: absolute;
			bottom: -1rem;
			right: 0;
			line-height: 0;
			margin-left: 1rem;
			color: gray;
		}

		#quote {
			display: inline-block;
			margin: 0 1em;
		}

		.footer {
			font-size: 0.75em;
			font-size: clamp(0.75rem, 1vw, 1.5rem);
			color: gray;
			a {
				color: darkgray;
			}
		}

		/* Dark mode styles */
		@media (prefers-color-scheme: dark) {
  			body {
				background: black;
  				color: white;
			}
			.quote-box::before {
				color: gray;
			}
			.quote-box::after {
				color: gray;
			}
			.footer {
				color: gray;
				a {
					color: lightgray;
				}
			}
		}
	</style>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&family=Joan&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="colorMode">
	<div class="container">
		<div class="quote-box">
			<span id="quote">Loading wisdom…</span>
		</div>
		<div class="footer">
			The Wisdom Project — Merlin Mann — <a href="http://wisdom.limo">wisdom.limo</a>
		</div>
	</div>

	<script>
		// ============================================
		// CONFIGURATION - Update this for production
		// ============================================
		const CONFIG = {
			// Public API endpoint (no API key required)
			 apiUrl: 'https://wisdom.visualyeti.com/quotes/api/v1/quote/public',
		};
		// ============================================

		async function getQuote() {
			try {
				const now = new Date();
				const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
				const response = await fetch(`${CONFIG.apiUrl}?date=${today}`);

				if (!response.ok) {
					const error = await response.json();
					throw new Error(error.error?.message || 'Failed to fetch quote');
				}

				const result = await response.json();

				if (result.success && result.data) {
					// Use the pre-rendered HTML from the server
					document.querySelector('#quote').innerHTML = result.data.quote_html;
				} else {
					throw new Error('Invalid response from server');
				}
			} catch (error) {
				console.error('Error fetching quote:', error);
				document.querySelector('#quote').textContent = 'Unable to load wisdom. Please check your configuration.';
			}
		}

		getQuote();
	</script>
</body>
</html>
